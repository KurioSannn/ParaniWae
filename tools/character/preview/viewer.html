<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Pratinjau karakter SILATARA</title>
<style>html,body{margin:0;background:#f6f2e9;font:13px system-ui}#c{width:100vw;height:100vh;display:block}#hud{position:fixed;left:8px;top:8px;background:#fcfbf7cc;padding:4px 8px;border-radius:6px}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas><div id="hud"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
// Pratinjau teknis: ?clip=<movement_id>&t=<detik>&cam=x,y,z&target=x,y,z&fov=30
const q = new URLSearchParams(location.search);
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color("#f6f2e9");
scene.add(new THREE.HemisphereLight("#fffaf0", "#b8a98f", 1.4));
const key = new THREE.DirectionalLight("#fff", 2.1); key.position.set(2.2, 4, 3); key.castShadow = true; scene.add(key);
const rim = new THREE.DirectionalLight("#cfe0d6", 0.8); rim.position.set(-3, 2.5, -2.5); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(2.2, 64), new THREE.MeshStandardMaterial({ color: "#e9e3d6" }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const cam = new THREE.PerspectiveCamera(Number(q.get("fov") || 30), innerWidth / innerHeight, 0.01, 50);
const v = (s, d) => (s || d).split(",").map(Number);
cam.position.set(...v(q.get("cam"), "0,1.1,3.6")); cam.lookAt(new THREE.Vector3(...v(q.get("target"), "0,0.9,0")));
const gltf = await new GLTFLoader().loadAsync("/model.glb");
gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
scene.add(gltf.scene);
const mixer = new THREE.AnimationMixer(gltf.scene);
const clip = gltf.animations.find((a) => a.name === (q.get("clip") || "idle"));
if (clip) { const a = mixer.clipAction(clip); a.play(); mixer.setTime(Number(q.get("t") || 0)); }
renderer.render(scene, cam);
document.getElementById("hud").textContent = `${q.get("clip") || "idle"} @ ${q.get("t") || 0}s · ${gltf.animations.length} klip`;
window.__ready = { clips: gltf.animations.map((a) => a.name) };
</script></body></html>
