[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: Depends() di default argumen adalah idiom resmi FastAPI.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/seed.py" = ["E501"]  # teks demo panjang
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
