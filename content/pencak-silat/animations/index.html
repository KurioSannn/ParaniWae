<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pratinjau Animasi Gerak</title><style>:root{--bg:#F6F2E9;--card:#FCFBF7;--ink:#17231F;--muted:#52605A;--line:#E4E1D8;--warn:#A95743}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}h1{font-size:20px;margin:0 0 4px}p.lead{color:var(--muted);max-width:70ch}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}figcaption{font-size:13px;margin-bottom:8px}img{width:100%;height:auto;display:block}.meta{font-size:11px;color:var(--muted)}.todo{border:1px dashed var(--warn);border-radius:8px;padding:12px;font-size:13px}</style></head><body><h1>Pratinjau animasi gerak (alat pengembangan)</h1><p class="lead">Semua animasi adalah interpretasi visual editorial atas dokumentasi tertulis dan <strong>belum divalidasi instruktur</strong>. Halaman ini bukan bagian aplikasi frontend.</p><main><figure><figcaption><code>mv.psdp.arah-delapan-penjuru</code><br>Arah delapan penjuru mata angin</figcaption><img src="mv.psdp.arah-delapan-penjuru/animation.svg" width="360" height="440" alt="Animasi Arah delapan penjuru mata angin"><p class="meta">7800 ms · top · 7295 byte</p></figure><figure><figcaption><code>mv.psdp.elak-atas</code><br>Elak Atas</figcaption><div class="todo"><strong>needs_reference</strong><p>Gerak melompat; tidak dianimasikan sampai teknik pendaratan aman dikonfirmasi instruktur.</p></div></figure><figure><figcaption><code>mv.psdp.elak-bawah</code><br>Elak bawah</figcaption><img src="mv.psdp.elak-bawah/animation.svg" width="360" height="440" alt="Animasi Elak bawah"><p class="meta">3900 ms · side · 12573 byte</p></figure><figure><figcaption><code>mv.psdp.elak-belakang</code><br>Elak belakang</figcaption><img src="mv.psdp.elak-belakang/animation.svg" width="360" height="440" alt="Animasi Elak belakang"><p class="meta">3900 ms · side · 12480 byte</p></figure><figure><figcaption><code>mv.psdp.elak-samping</code><br>Elak samping</figcaption><img src="mv.psdp.elak-samping/animation.svg" width="360" height="440" alt="Animasi Elak samping"><p class="meta">3900 ms · front · 12818 byte</p></figure><figure><figcaption><code>mv.psdp.hindaran-angkat-kaki</code><br>Hindaran Angkat Kaki</figcaption><div class="todo"><strong>needs_reference</strong><p>Tinggi angkatan dan sikap badan tidak dijelaskan; gerakan bergantung pada sapuan lawan.</p></div></figure><figure><figcaption><code>mv.psdp.hindaran-hadap</code><br>Hindaran hadap</figcaption><img src="mv.psdp.hindaran-hadap/animation.svg" width="360" height="440" alt="Animasi Hindaran hadap"><p class="meta">4500 ms · side · 13348 byte</p></figure><figure><figcaption><code>mv.psdp.hindaran-silang</code><br>Hindaran Silang</figcaption><div class="todo"><strong>needs_reference</strong><p>Arah silang tidak disebut; butuh demonstrasi.</p></div></figure><figure><figcaption><code>mv.psdp.hindaran-sisi</code><br>Hindaran Sisi</figcaption><div class="todo"><strong>needs_reference</strong><p>Arah langkah dan perubahan orientasi badan relatif lawan butuh demonstrasi; uraian hanya menyebut hasil akhirnya.</p></div></figure><figure><figcaption><code>mv.psdp.kuda-kuda-belakang</code><br>Kuda-kuda belakang</figcaption><img src="mv.psdp.kuda-kuda-belakang/animation.svg" width="360" height="440" alt="Animasi Kuda-kuda belakang"><p class="meta">5000 ms · side · 14217 byte</p></figure><figure><figcaption><code>mv.psdp.kuda-kuda-depan</code><br>Kuda-kuda depan</figcaption><img src="mv.psdp.kuda-kuda-depan/animation.svg" width="360" height="440" alt="Animasi Kuda-kuda depan"><p class="meta">5000 ms · side · 14086 byte</p></figure><figure><figcaption><code>mv.psdp.kuda-kuda-menyamping</code><br>Kuda-kuda menyamping kiri/kanan</figcaption><img src="mv.psdp.kuda-kuda-menyamping/animation.svg" width="360" height="440" alt="Animasi Kuda-kuda menyamping kiri/kanan"><p class="meta">7800 ms · front · 18873 byte</p></figure><figure><figcaption><code>mv.psdp.kuda-kuda-samping</code><br>Kuda-kuda samping</figcaption><img src="mv.psdp.kuda-kuda-samping/animation.svg" width="360" height="440" alt="Animasi Kuda-kuda samping"><p class="meta">6000 ms · front · 16011 byte</p></figure><figure><figcaption><code>mv.psdp.kuda-kuda-silang-belakang</code><br>Kuda-kuda silang belakang</figcaption><img src="mv.psdp.kuda-kuda-silang-belakang/animation.svg" width="360" height="440" alt="Animasi Kuda-kuda silang belakang"><p class="meta">4500 ms · front · 13606 byte</p></figure><figure><figcaption><code>mv.psdp.kuda-kuda-silang-depan</code><br>Kuda-kuda silang depan</figcaption><img src="mv.psdp.kuda-kuda-silang-depan/animation.svg" width="360" height="440" alt="Animasi Kuda-kuda silang depan"><p class="meta">4500 ms · front · 13522 byte</p></figure><figure><figcaption><code>mv.psdp.kuda-kuda-tengah</code><br>Kuda-kuda tengah</figcaption><img src="mv.psdp.kuda-kuda-tengah/animation.svg" width="360" height="440" alt="Animasi Kuda-kuda tengah"><p class="meta">6200 ms · front · 16265 byte</p></figure><figure><figcaption><code>mv.psdp.langkah-angkatan</code><br>Langkah angkatan (tinggi &amp; rendah)</figcaption><img src="mv.psdp.langkah-angkatan/animation.svg" width="360" height="440" alt="Animasi Langkah angkatan (tinggi &amp; rendah)"><p class="meta">7400 ms · side · 17463 byte</p></figure><figure><figcaption><code>mv.psdp.langkah-geseran</code><br>Langkah geseran</figcaption><img src="mv.psdp.langkah-geseran/animation.svg" width="360" height="440" alt="Animasi Langkah geseran"><p class="meta">5400 ms · side · 15425 byte</p></figure><figure><figcaption><code>mv.psdp.langkah-ingsutan</code><br>Langkah Ingsutan</figcaption><div class="todo"><strong>needs_reference</strong><p>Urutan poros tumit/ujung kaki dan arah perpindahan perlu diperagakan instruktur; menebak pola akan mengarang koreografi.</p></div></figure><figure><figcaption><code>mv.psdp.langkah-lompatan</code><br>Langkah Lompatan / Loncatan</figcaption><div class="todo"><strong>needs_reference</strong><p>Teknik tolakan &amp; pendaratan aman (tekukan lutut saat mendarat, jarak) tidak dijelaskan sumber; tidak dianimasikan agar tidak mendorong latihan lompat tanpa pengawasan.</p></div></figure><figure><figcaption><code>mv.psdp.langkah-putaran</code><br>Langkah Putaran</figcaption><div class="todo"><strong>needs_reference</strong><p>Besar sudut putar, kaki poros, dan arah &#x27;ke luar&#x27; perlu dikonfirmasi dengan demonstrasi instruktur; rotasi kaki terhadap lantai butuh tampilan atas + samping.</p></div></figure><figure><figcaption><code>mv.psdp.pola-langkah-huruf-s</code><br>Pola Langkah Huruf S</figcaption><div class="todo"><strong>needs_reference</strong><p>Diagram huruf S perlu disalin ulang dari sumber cetak atau dari instruktur.</p></div></figure><figure><figcaption><code>mv.psdp.pola-langkah-ladam</code><br>Pola Langkah Ladam / U</figcaption><div class="todo"><strong>needs_reference</strong><p>Diagram nomor langkah ladam tunggal/rangkap harus disalin ulang dari sumber cetak (atau dari instruktur) — teks ekstraksi PDF tidak memuat posisi yang dapat diandalkan.</p></div></figure><figure><figcaption><code>mv.psdp.pola-langkah-lurus</code><br>Pola langkah lurus</figcaption><img src="mv.psdp.pola-langkah-lurus/animation.svg" width="360" height="440" alt="Animasi Pola langkah lurus"><p class="meta">7100 ms · top · 4916 byte</p></figure><figure><figcaption><code>mv.psdp.pola-langkah-segiempat</code><br>Pola Langkah Segiempat</figcaption><div class="todo"><strong>needs_reference</strong><p>Diagram segiempat lurus/potong perlu disalin ulang dari sumber cetak atau dari instruktur.</p></div></figure><figure><figcaption><code>mv.psdp.pola-langkah-segitiga</code><br>Pola Langkah Segitiga</figcaption><div class="todo"><strong>needs_reference</strong><p>Diagram segitiga tunggal/rangkap perlu disalin ulang dari sumber cetak atau dari instruktur.</p></div></figure><figure><figcaption><code>mv.psdp.pola-langkah-zigzag</code><br>Pola langkah gergaji / zig-zag</figcaption><img src="mv.psdp.pola-langkah-zigzag/animation.svg" width="360" height="440" alt="Animasi Pola langkah gergaji / zig-zag"><p class="meta">7800 ms · top · 5522 byte</p></figure><figure><figcaption><code>mv.psdp.sikap-duduk-biasa</code><br>Sikap Duduk</figcaption><div class="todo"><strong>needs_reference</strong><p>Arah dan bentuk tekukan kaki tidak dijelaskan; butuh referensi visual berizin.</p></div></figure><figure><figcaption><code>mv.psdp.sikap-duduk-sempok</code><br>Sikap Sempok / Depok</figcaption><div class="todo"><strong>needs_reference</strong><p>Bentuk lipatan kaki pada sempok dan cara masuk/keluar posisi perlu foto/sketsa referensi berizin atau demonstrasi instruktur; tampilan 2D satu sudut tidak cukup.</p></div></figure><figure><figcaption><code>mv.psdp.sikap-duduk-sila</code><br>Sikap Sila</figcaption><div class="todo"><strong>needs_reference</strong><p>Bentuk lipatan kaki perlu referensi visual berizin; perbedaan dengan sempok harus dikonfirmasi instruktur.</p></div></figure><figure><figcaption><code>mv.psdp.sikap-duduk-simpuh</code><br>Sikap Simpuh</figcaption><div class="todo"><strong>needs_reference</strong><p>Sumber tidak menjelaskan apakah pinggul duduk di atas tumit; animasi akan memaksakan satu tafsir — butuh konfirmasi instruktur.</p></div></figure><figure><figcaption><code>mv.psdp.sikap-duduk-trapsila</code><br>Sikap Trapsila</figcaption><div class="todo"><strong>needs_reference</strong><p>Posisi kaki dalam/luar butuh referensi tiga dimensi; tampilan 2D tidak memadai tanpa sketsa berizin.</p></div></figure><figure><figcaption><code>mv.psdp.sikap-istirahat</code><br>Sikap istirahat</figcaption><img src="mv.psdp.sikap-istirahat/animation.svg" width="360" height="440" alt="Animasi Sikap istirahat"><p class="meta">5000 ms · front · 14283 byte</p></figure><figure><figcaption><code>mv.psdp.sikap-pasang-1</code><br>Sikap pasang 1</figcaption><img src="mv.psdp.sikap-pasang-1/animation.svg" width="360" height="440" alt="Animasi Sikap pasang 1"><p class="meta">5100 ms · side · 15131 byte</p></figure><figure><figcaption><code>mv.psdp.sikap-pasang-2</code><br>Sikap Pasang 2</figcaption><div class="todo"><strong>needs_reference</strong><p>Rotasi badan 45° adalah gerak tiga dimensi; rig 2D satu sudut tidak dapat memperlihatkannya dengan benar. Butuh rig 3/4 atau dua tampilan + konfirmasi instruktur.</p></div></figure><figure><figcaption><code>mv.psdp.sikap-pasang-3</code><br>Sikap Pasang 3</figcaption><div class="todo"><strong>needs_reference</strong><p>Tarikan &#x27;serong&#x27; melibatkan arah diagonal di lantai; butuh tampilan atas atau 3/4 dan sudut yang dikonfirmasi instruktur.</p></div></figure><figure><figcaption><code>mv.psdp.sikap-pasang-4</code><br>Sikap pasang 4</figcaption><img src="mv.psdp.sikap-pasang-4/animation.svg" width="360" height="440" alt="Animasi Sikap pasang 4"><p class="meta">5100 ms · front · 15513 byte</p></figure><figure><figcaption><code>mv.psdp.sikap-pasang-5</code><br>Sikap Pasang 5</figcaption><div class="todo"><strong>needs_reference</strong><p>Kombinasi langkah ke depan, silang belakang, dan pandangan menyamping tidak dapat dibaca dari satu sudut 2D tanpa ambigu; butuh sisi pandang yang dikonfirmasi instruktur.</p></div></figure><figure><figcaption><code>mv.psdp.sikap-pasang-6</code><br>Sikap pasang 6</figcaption><img src="mv.psdp.sikap-pasang-6/animation.svg" width="360" height="440" alt="Animasi Sikap pasang 6"><p class="meta">5100 ms · front · 15562 byte</p></figure><figure><figcaption><code>mv.psdp.sikap-pasang-7</code><br>Sikap Pasang 7</figcaption><div class="todo"><strong>needs_reference</strong><p>Arah silang relatif terhadap badan yang menyamping tidak dapat ditentukan dari teks; butuh sketsa berizin atau demonstrasi.</p></div></figure><figure><figcaption><code>mv.psdp.sikap-pasang-8</code><br>Sikap pasang 8</figcaption><img src="mv.psdp.sikap-pasang-8/animation.svg" width="360" height="440" alt="Animasi Sikap pasang 8"><p class="meta">4900 ms · side · 15005 byte</p></figure><figure><figcaption><code>mv.psdp.sikap-pemusatan-diri</code><br>Sikap berdoa / pemusatan diri</figcaption><img src="mv.psdp.sikap-pemusatan-diri/animation.svg" width="360" height="440" alt="Animasi Sikap berdoa / pemusatan diri"><p class="meta">6700 ms · side · 16119 byte</p></figure><figure><figcaption><code>mv.psdp.sikap-tegak</code><br>Sikap tegak 1–4</figcaption><img src="mv.psdp.sikap-tegak/animation.svg" width="360" height="440" alt="Animasi Sikap tegak 1–4"><p class="meta">7800 ms · front · 19674 byte</p></figure></main></body></html>
