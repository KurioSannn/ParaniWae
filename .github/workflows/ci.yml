# CI SILATARA.
# STATUS: BELUM PERNAH dijalankan di GitHub (repo belum memakai Git/remote). Yang SUDAH dilakukan lokal: sintaks YAML
# divalidasi; setiap perintah di bawah dijalankan ekuivalen lewat Docker (pytest, migrasi up/down/up, ruff, eslint, tsc,
# vitest, next build, E2E terisolasi, Trivy). Jangan anggap CI hijau sebelum run pertama di GitHub benar-benar sukses.
#
# Semua action di-pin ke SHA COMMIT (hasil peel tag beranotasi, diverifikasi via git ls-remote); versi di komentar.
# Dependabot memperbarui SHA/digest lewat PR yang melewati CI ini.
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-bookworm@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
        env: { POSTGRES_USER: silatara, POSTGRES_PASSWORD: ci_password, POSTGRES_DB: silatara }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U silatara" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: silatara
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: silatara
      APP_ENV: development
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: ruff check .
      # Migrasi pada DB kosong terisolasi: up -> down ke base -> up (dijalankan lokal: lulus)
      - name: Migration test (up/down/up)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      # pytest membuat & memigrasi database terpisah silatara_test; tidak menyentuh DB 'silatara'
      - run: pytest -q
      - name: Audit dependensi Python
        run: pip install pip-audit && pip-audit -r constraints.txt --disable-pip --no-deps

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: mkdir -p public/mediapipe/wasm && cp node_modules/@mediapipe/tasks-vision/wasm/* public/mediapipe/wasm/
      - run: npm run build:worker
      - run: npm run build
      - run: npm audit --audit-level=high

  # Pindai image PRODUKSI. Gagal eksplisit bila ada HIGH/CRITICAL yang sudah ada perbaikannya.
  # Temuan tanpa perbaikan upstream dilaporkan (tabel) tetapi tidak menggagalkan; lihat docs/SECURITY_HYGIENE.md.
  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: ./scripts/fetch-mediapipe-assets.sh
      - run: docker build --target prod -t silatara-backend:ci backend
      - run: docker build --target prod -t silatara-frontend:ci frontend
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "silatara-backend:ci", severity: "CRITICAL,HIGH", ignore-unfixed: "true", exit-code: "1", version: "v0.76.2" }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "silatara-frontend:ci", severity: "CRITICAL,HIGH", ignore-unfixed: "true", exit-code: "1", version: "v0.76.2" }

  # E2E TERISOLASI: stack Compose terpisah (project silatara-e2e, DB tmpfs, tanpa port host), build produksi.
  # Menjalankan: E2E API+SSR (python, termasuk probe XFF palsu) lalu Playwright/Chromium: kamera PALSU (lifecycle, worker,
  # privasi), audit visual 3 viewport dengan axe + KONTRAS pada CSS ter-render, auth, belajar.
  e2e-isolated:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: ./scripts/fetch-mediapipe-assets.sh
      - run: ./scripts/e2e.sh all
      - name: Unggah laporan & screenshot (hanya data DEMO; tanpa kredensial nyata)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/screenshots
            artifacts/playwright-report
            artifacts/camera-metrics.json
            artifacts/results.json
